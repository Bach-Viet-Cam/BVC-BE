# Local Postgres for development and tests only. Never points at the shared DB.
# Start: npm run db:up  (works with `docker compose` or `podman compose`)
name: bvc-dev

services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: bvc-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bvc
      POSTGRES_PASSWORD: bvc_local
      POSTGRES_DB: bvc_dev
    ports:
      - "5433:5432"
    volumes:
      - bvc-dev-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  bvc-dev-pgdata:
