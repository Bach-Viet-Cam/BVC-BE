name: CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONTAINER_NAME: bvc-backend
  COMPOSE_PROJECT: bvc-backend
  # .env on the self-hosted runner machine (kept outside the repo)
  ENV_FILE: D:\BVC\env\backend.env

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      - run: npm run build
      # No test suite yet — add a test step here once a framework (e.g. vitest) is chosen.

  docker-validate:
    if: github.event_name == 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: [self-hosted, Windows]
    environment: production
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy .env into workspace
        run: |
          if (-not (Test-Path $env:ENV_FILE)) {
            Write-Error "CRITICAL: Could not find $env:ENV_FILE on the runner machine!"
            exit 1
          }
          Copy-Item -Path $env:ENV_FILE -Destination ".env" -Force

      - name: Remove container owned by another compose project
        run: |
          # The container used to be managed by the monorepo compose project; free its name once.
          $owner = docker ps -a --filter "name=^$env:CONTAINER_NAME$" --format '{{.Label "com.docker.compose.project"}}'
          if ($owner -and $owner -ne $env:COMPOSE_PROJECT) {
            Write-Host "Removing $env:CONTAINER_NAME (owned by compose project '$owner')"
            docker rm -f $env:CONTAINER_NAME
          }

      - name: Rebuild and restart with Docker Compose
        run: |
          docker compose up -d --build --remove-orphans
          docker image prune -f

      - name: Smoke test health endpoint
        run: |
          for ($i = 1; $i -le 10; $i++) {
            curl.exe -fsS http://localhost:8000/api/health
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 3
          }
          Write-Error "Backend health check failed"
          exit 1
